<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistema de Asistencia Lexicom</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="descarga.png">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background: #f1f5f9;
      color: #334155;
    }
    .contenedor {
      width: 100%;
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
      box-sizing: border-box;
    }
    h2, h3, h4 { text-align: center; margin-top: 5px; color: #0f172a; }
    label { font-size: 12px; font-weight: bold; color: #475569; display: block; margin-top: 8px; }
    input, select, textarea {
      width: 100%;
      padding: 11px;
      margin-top: 4px;
      margin-bottom: 10px;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      font-family: Arial, sans-serif;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      background: #1a73e8;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover { background: #1557b0; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-perfil { background: #475569; font-size: 14px; padding: 10px; }
    .btn-secundario { background: #64748b; font-size: 14px; }
    #mensaje {
      margin-top: 15px;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      display: none;
      font-size: 14px;
    }
    #gpsResultado { margin-top: 10px; text-align: center; font-size: 13px; color: #64748b; }
    .caja-perfil {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      text-align: left;
    }
    .pie-registro {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
    }
    .panel-excepcion {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 8px;
      padding: 14px;
      margin-top: 12px;
      margin-bottom: 12px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <h2>Sistema de Asistencia</h2>
    
    <div id="usuarioAutenticado" style="display:none; text-align:center; margin-bottom:12px; color:#16a34a; font-weight:bold; font-size:14px;"></div>
    
    <!-- Botón Perfil -->
    <div id="panelAccionesPostLogin" style="display:none; margin-bottom:12px;">
      <button class="btn-perfil" onclick="abrirModalPerfil()">👤 Mis Datos y Cuenta Bancaria</button>
    </div>

    <!-- Panel de Perfil y Datos Bancarios -->
    <div id="modalPerfil" class="caja-perfil" style="display:none;">
      <h3 style="margin-top:0;">Mi Perfil y Datos de Abono</h3>
      <p style="font-size:12px; color:#64748b; margin-top:-5px; text-align:center;">
        Completa tus datos para el pago de haberes por Recursos Humanos.
      </p>

      <label>Sede Asignada:</label>
      <select id="perfilSede" disabled style="background:#e2e8f0; cursor:not-allowed;"></select>

      <label>Celular de Contacto:</label>
      <input id="perfilCelular" type="tel" placeholder="Ej. 987654321">

      <label>Dirección de Domicilio:</label>
      <input id="perfilDireccion" type="text" placeholder="Av. / Calle / Distrito">

      <hr style="margin:12px 0; border:0; border-top:1px solid #cbd5e1;">
      <h4 style="margin:5px 0 10px 0; text-align:left; color:#1e293b;">Datos de Cuenta Bancaria</h4>

      <label>Entidad Financiera (Banco):</label>
      <select id="perfilBanco">
        <option value="">-- Selecciona tu banco --</option>
        <option value="BCP">BCP (Banco de Crédito del Perú)</option>
        <option value="BBVA">BBVA</option>
        <option value="INTERBANK">Interbank</option>
        <option value="SCOTIABANK">Scotiabank</option>
        <option value="BANCO DE LA NACION">Banco de la Nación</option>
        <option value="BANBIF">BanBif</option>
        <option value="PICHINCHA">Banco Pichincha</option>
        <option value="GNB">Banco GNB</option>
        <option value="FALABELLA">Banco Falabella</option>
        <option value="RIPLEY">Banco Ripley</option>
        <option value="MIBANCO">Mibanco</option>
        <option value="CAJA AREQUIPA">Caja Arequipa</option>
        <option value="CAJA HUANCAYO">Caja Huancayo</option>
        <option value="CAJA PIURA">Caja Piura</option>
        <option value="CAJA CUSCO">Caja Cusco</option>
        <option value="OTRO">Otro / Otra Entidad Financiera</option>
      </select>

      <label>Tipo de Cuenta:</label>
      <select id="perfilTipoCuenta">
        <option value="AHORROS">Cuenta de Ahorros</option>
        <option value="CORRIENTE">Cuenta Corriente</option>
        <option value="SUELDO">Cuenta Sueldo</option>
      </select>

      <label>Número de Cuenta:</label>
      <input id="perfilNumCuenta" type="text" placeholder="N° de cuenta bancaria">

      <label>Código Interbancario (CCI - 20 dígitos):</label>
      <input id="perfilCci" type="text" maxlength="20" placeholder="00219400234567891234">

      <button onclick="guardarDatosPerfil()" style="background:#16a34a; margin-top:5px;">💾 Guardar Mis Datos</button>
      <button onclick="cerrarModalPerfil()" class="btn-secundario">Cerrar</button>
    </div>

    <!-- 1. Bloque Login DNI -->
    <div id="loginPanel">
      <label style="margin-top:0;">Ingresa tu documento de identidad:</label>
      <input id="docLogin" type="tel" maxlength="8" placeholder="Número de DNI (8 dígitos)">
      <button onclick="enviarOTP()">Enviar código de acceso</button>
    </div>

    <!-- 2. Bloque OTP -->
    <div id="otpPanel" style="display:none;">
      <label>Código de verificación recibido en tu correo:</label>
      <input id="otp" type="text" maxlength="6" placeholder="Código de 6 dígitos">
      <button onclick="validarCodigo()">Validar código e ingresar</button>
    </div>

    <!-- 3. Bloque Registro Solicitud Nuevo Trabajador -->
    <div id="registroPanel" style="display:none;">
      <h3>Registro de Nuevo Trabajador</h3>
      <label>DNI:</label>
      <input id="regDni" placeholder="DNI (8 dígitos)" maxlength="8">
      
      <label>Correo Electrónico:</label>
      <input id="regCorreo" type="email" placeholder="correo@ejemplo.com">
      
      <div style="display:flex; gap:10px;">
        <div style="flex:1;">
          <label>Nombres:</label>
          <input id="regNombres" placeholder="Nombres">
        </div>
        <div style="flex:1;">
          <label>Apellidos:</label>
          <input id="regApellidos" placeholder="Apellidos">
        </div>
      </div>
      
      <label>Celular:</label>
      <input id="regCelular" type="tel" placeholder="987654321" maxlength="9">

      <label>Sede de Trabajo:</label>
      <select id="regSede"></select>
      
      <button onclick="registrarNuevoTrabajador()" style="background:#059669; margin-top:5px;">Enviar Solicitud a RRHH</button>
    </div>

    <!-- 4. Bloque Marcaje y GPS -->
    <div id="marcajePanel" style="display:none;">
      <button onclick="obtenerUbicacion()">📍 Obtener ubicación GPS</button>
      <div id="gpsResultado"></div>

      <!-- Cámara 1: Selfie Personal -->
      <input type="file" id="cameraInput" accept="image/*" capture="user" style="display:none;" onchange="procesarFoto(event)">
      <button id="btnAbrirCamara" onclick="abrirCamara()" style="display:none; background:#0f9d58;">📷 Tomar Selfie</button>

      <img id="previewSelfie" style="display:none; width:100%; border-radius:8px; margin-top:10px; border: 1px solid #ddd;">
      <canvas id="canvasCompresor" style="display:none;"></canvas>
      <div id="fotoEstado" style="color:#16a34a; font-weight:bold; margin-top:8px; text-align:center;"></div>
      <br>

      <!-- Panel dinámico de Justificación / Fuera de Sede -->
      <div id="panelExcepcion" class="panel-excepcion" style="display:none;">
        <h4 style="margin:0 0 6px 0; color:#c2410c;">⚠️ Fuera de Sede Detectado</h4>
        <p style="font-size:12px; color:#7c2d12; margin:0 0 10px 0;">
          Selecciona el motivo y adjunta la foto del comprobante o constancia médica.
        </p>

        <label>Motivo de la marcación:</label>
        <select id="motivoExcepcion">
          <option value="TRAMITE_AGENCIA">📦 Comisión de Servicio / Trámite en Agencia</option>
          <option value="CITA_MEDICA">🏥 Cita Médica / EsSalud / Clínica</option>
          <option value="OTRA_SEDE">🏢 Trabajo en otra Sede</option>
          <option value="PERMISO_AUTORIZADO">📝 Permiso / Salida autorizada</option>
        </select>

        <label>Detalle de la labor o justificación:</label>
        <input id="detalleExcepcion" placeholder="Ej. Shalom La Victoria, Policlínico Grau...">

        <!-- Cámara 2: Foto de Evidencia / Documento -->
        <input type="file" id="evidenciaInput" accept="image/*" capture="environment" style="display:none;" onchange="procesarFotoEvidencia(event)">
        <button type="button" onclick="document.getElementById('evidenciaInput').click()" style="background:#ea580c; font-size:13px; padding:10px;">
          📎 Tomar Foto del Comprobante / Constancia
        </button>

        <img id="previewEvidencia" style="display:none; width:100%; border-radius:6px; margin-top:8px; border:1px solid #cbd5e1;">
        <div id="evidenciaEstado" style="color:#c2410c; font-size:12px; font-weight:bold; margin-top:4px; text-align:center;"></div>
      </div>

      <div id="botonesMarcajePlanilla">
        <button id="btnIngreso" onclick="ejecutarMarcaje('INGRESO')" style="display:none;">Registrar Ingreso</button>
        <button id="btnSalida" onclick="ejecutarMarcaje('SALIDA')" style="display:none;">Registrar Salida</button>
      </div>
    </div>

    <!-- Mensajes de feedback -->
    <div id="mensaje"></div>

    <!-- 5. Pie con botón 'Registrarse' -->
    <div id="pieRegistro" class="pie-registro">
      <button id="btnAlternarRegistro" class="btn-secundario" onclick="alternarRegistro()">Registrarse</button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbznyYRoE6A9dH6dGPlNYhN9QunCgc9coY7e578WspkOQl_ULHSdUaF4HPoiJ1naUW0I/exec";

    let correoUsuario = null;
    let docUsuario = null;
    let modoRegistro = false;
    let latitudActual = null;
    let longitudActual = null;
    let selfieActual = null;
    let evidenciaActual = null;
    let requiereExcepcion = false;

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(console.error);
    }

    async function llamarAPI(payload) {
      const response = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      return await response.json();
    }

    function obtenerDeviceId() {
      let devId = localStorage.getItem("asistencia_device_token");
      if (!devId) {
        const ua = navigator.userAgent;
        let modelo = /android/i.test(ua) ? "Android" : (/iPhone|iPad/i.test(ua) ? "iPhone" : "Movil");
        const randomHex = Math.random().toString(16).substring(2, 10).toUpperCase();
        devId = modelo + "_" + randomHex;
        localStorage.setItem("asistencia_device_token", devId);
      }
      return devId;
    }

    function mostrarMensaje(texto, tipo) {
      const msg = document.getElementById("mensaje");
      msg.style.display = "block";
      msg.innerHTML = texto;
      msg.style.background = (tipo === "ok") ? "#d1fae5" : "#fee2e2";
      msg.style.color = (tipo === "ok") ? "#065f46" : "#991b1b";
    }

    window.onload = async function() {
      try {
        const res = await llamarAPI({ accion: "obtenerSedes" });
        if (res.ok && res.sedes) {
          let html = "";
          res.sedes.forEach(s => html += `<option value="${s.codigo}">${s.codigo} - ${s.nombre}</option>`);
          document.getElementById("regSede").innerHTML = html;
          document.getElementById("perfilSede").innerHTML = html;
        }
      } catch (err) {
        console.error("Error al cargar sedes:", err);
      }
    };

    function alternarRegistro() {
      modoRegistro = !modoRegistro;
      document.getElementById("mensaje").style.display = "none";
      document.getElementById("loginPanel").style.display = modoRegistro ? "none" : "block";
      document.getElementById("otpPanel").style.display = "none";
      document.getElementById("registroPanel").style.display = modoRegistro ? "block" : "none";
      document.getElementById("btnAlternarRegistro").innerText = modoRegistro ? "← Ya tengo cuenta (Volver)" : "Registrarse";
    }

    async function enviarOTP() {
      const doc = document.getElementById("docLogin").value.trim();
      if (!doc || doc.length !== 8) return mostrarMensaje("Ingresa un DNI válido de 8 dígitos", "error");

      mostrarMensaje("Verificando DNI y enviando código...", "ok");
      try {
        const res = await llamarAPI({ accion: "enviarOTP", dni: doc });
        if (res.ok) {
          docUsuario = doc;
          correoUsuario = res.correo;
          document.getElementById("otpPanel").style.display = "block";
          mostrarMensaje(res.mensaje, "ok");
        } else {
          mostrarMensaje(res.mensaje, "error");
        }
      } catch (err) {
        mostrarMensaje("Error al conectar: " + err.message, "error");
      }
    }

    async function validarCodigo() {
      const codigo = document.getElementById("otp").value.trim();
      if (!codigo) return mostrarMensaje("Ingresa el código OTP", "error");

      mostrarMensaje("Validando código y verificando dispositivo...", "ok");
      const deviceId = obtenerDeviceId();

      try {
        const res = await llamarAPI({
          accion: "validarOTP",
          correo: correoUsuario,
          codigo: codigo,
          deviceId: deviceId
        });

        if (res.ok) {
          document.getElementById("loginPanel").style.display = "none";
          document.getElementById("otpPanel").style.display = "none";
          document.getElementById("pieRegistro").style.display = "none";

          const userLabel = document.getElementById("usuarioAutenticado");
          userLabel.style.display = "block";
          userLabel.innerHTML = `✅ Identificado: DNI ${docUsuario}<br><small style="color:#64748b;">${correoUsuario}</small>`;

          document.getElementById("panelAccionesPostLogin").style.display = "block";
          document.getElementById("marcajePanel").style.display = "block";

          const estadoRes = await llamarAPI({ accion: "obtenerEstadoHoy", correo: correoUsuario });
          configurarBotonesPlanilla(estadoRes.estado);
        } else {
          mostrarMensaje(res.mensaje, "error");
        }
      } catch (err) {
        mostrarMensaje("Error al validar: " + err.message, "error");
      }
    }

    async function abrirModalPerfil() {
      mostrarMensaje("Cargando perfil...", "ok");
      try {
        const res = await llamarAPI({ accion: "obtenerPerfil", correo: correoUsuario });
        document.getElementById("mensaje").style.display = "none";
        if (res.ok && res.datos) {
          document.getElementById("perfilCelular").value = res.datos.celular || "";
          document.getElementById("perfilDireccion").value = res.datos.direccion || "";
          document.getElementById("perfilBanco").value = res.datos.banco || "";
          document.getElementById("perfilTipoCuenta").value = res.datos.tipoCuenta || "AHORROS";
          document.getElementById("perfilNumCuenta").value = res.datos.numCuenta || "";
          document.getElementById("perfilCci").value = res.datos.cci || "";
          if (res.datos.sede) {
            const selectSede = document.getElementById("perfilSede");
            const normalizada = res.datos.sede.toString().replace(/_/g, " ").trim().toUpperCase();
            for (let i = 0; i < selectSede.options.length; i++) {
              if (selectSede.options[i].value.replace(/_/g, " ").trim().toUpperCase() === normalizada) {
                selectSede.selectedIndex = i;
                break;
              }
            }
          }
        }
        document.getElementById("modalPerfil").style.display = "block";
      } catch (err) {
        mostrarMensaje("Error al consultar perfil: " + err.message, "error");
      }
    }

    function cerrarModalPerfil() { document.getElementById("modalPerfil").style.display = "none"; }

    async function guardarDatosPerfil() {
      const cci = document.getElementById("perfilCci").value.trim();
      if (cci && cci.length !== 20) return mostrarMensaje("El CCI debe tener exactamente 20 dígitos", "error");

      mostrarMensaje("Guardando cambios...", "ok");
      const datos = {
        correo: correoUsuario,
        celular: document.getElementById("perfilCelular").value.trim(),
        direccion: document.getElementById("perfilDireccion").value.trim(),
        banco: document.getElementById("perfilBanco").value.trim(),
        tipoCuenta: document.getElementById("perfilTipoCuenta").value.trim(),
        numCuenta: document.getElementById("perfilNumCuenta").value.trim(),
        cci: cci
      };

      try {
        const res = await llamarAPI({ accion: "actualizarPerfil", correo: correoUsuario, datos: datos });
        mostrarMensaje(res.mensaje, res.ok ? "ok" : "error");
        if (res.ok) cerrarModalPerfil();
      } catch (err) {
        mostrarMensaje("Error al guardar: " + err.message, "error");
      }
    }

    function obtenerUbicacion() {
      if (!navigator.geolocation) return mostrarMensaje("Navegador no soporta GPS", "error");
      navigator.geolocation.getCurrentPosition(
        p => {
          latitudActual = p.coords.latitude;
          longitudActual = p.coords.longitude;
          document.getElementById("gpsResultado").innerHTML = `📍 Lat: ${latitudActual.toFixed(6)} | Lon: ${longitudActual.toFixed(6)}`;
          document.querySelector('button[onclick="obtenerUbicacion()"]').style.display = "none";
          document.getElementById("btnAbrirCamara").style.display = "block";
        },
        () => mostrarMensaje("Activa el GPS de tu celular", "error"),
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function abrirCamara() { document.getElementById("cameraInput").click(); }

    function procesarFoto(e) {
      const file = e.target.files[0];
      if (!file) return;

      mostrarMensaje("Procesando selfie...", "ok");
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 800;
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }

          const canvas = document.getElementById("canvasCompresor");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);

          selfieActual = canvas.toDataURL("image/jpeg", 0.8);
          const preview = document.getElementById("previewSelfie");
          preview.src = selfieActual;
          preview.style.display = "block";
          document.getElementById("fotoEstado").innerHTML = "✅ Selfie lista";
          document.getElementById("btnAbrirCamara").innerHTML = "🔄 Tomar otra selfie";
          document.getElementById("mensaje").style.display = "none";
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Procesar foto de evidencia / comprobante
    function procesarFotoEvidencia(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const estadoLbl = document.getElementById("evidenciaEstado");
      estadoLbl.style.color = "#ea580c";
      estadoLbl.innerHTML = "⏳ Procesando comprobante...";

      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 800;
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }

          const canvas = document.getElementById("canvasCompresor");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);

          // Guardar base64
          evidenciaActual = canvas.toDataURL("image/jpeg", 0.8);
          
          const preview = document.getElementById("previewEvidencia");
          preview.src = evidenciaActual;
          preview.style.display = "block";
          
          estadoLbl.style.color = "#16a34a";
          estadoLbl.innerHTML = "✅ Foto de comprobante lista para enviar";
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Ejecutar marcaje blindado
    async function ejecutarMarcaje(tipo) {
      if (!latitudActual || !longitudActual) return mostrarMensaje("Por favor obtén tu ubicación GPS", "error");
      if (!selfieActual) return mostrarMensaje("Por favor tómate tu selfie primero", "error");

      const panelEx = document.getElementById("panelExcepcion");
      // Detectamos si el panel está en pantalla
      const esExcepcionVisible = panelEx && (panelEx.style.display === "block" || requiereExcepcion);

      let detalleTexto = "";
      let motivoTexto = "";

      if (esExcepcionVisible) {
        detalleTexto = document.getElementById("detalleExcepcion").value.trim();
        motivoTexto = document.getElementById("motivoExcepcion").value;

        if (!detalleTexto) {
          mostrarMensaje("Escribe el motivo o trámite realizado (ej. Shalom, Essalud...)", "error");
          document.getElementById("detalleExcepcion").focus();
          return;
        }

        if (!evidenciaActual) {
          mostrarMensaje("Debes tomar la foto al comprobante, ticket o constancia médica.", "error");
          return;
        }
      }

      const boton = (tipo === "INGRESO") ? document.getElementById("btnIngreso") : document.getElementById("btnSalida");
      boton.disabled = true;
      boton.innerHTML = "Subiendo fotos...";

      try {
        // 1. Subir selfie personal a Drive
        const fotoRes = await llamarAPI({ accion: "guardarSelfie", correo: correoUsuario, imagenBase64: selfieActual });
        const urlSelfie = (fotoRes && fotoRes.url) ? fotoRes.url : "";

        // 2. Subir foto de comprobante/evidencia si aplica
        let urlEvidencia = "";
        if (esExcepcionVisible && evidenciaActual) {
          boton.innerHTML = "Subiendo comprobante...";
          const evidRes = await llamarAPI({ accion: "guardarSelfie", correo: correoUsuario + "_EVIDENCIA", imagenBase64: evidenciaActual });
          urlEvidencia = (evidRes && evidRes.url) ? evidRes.url : "";
        }

        boton.innerHTML = `Marcando ${tipo.toLowerCase()}...`;

        // 3. Armar el paquete a enviar
        const payload = {
          accion: "marcarAsistencia",
          correo: correoUsuario,
          tipo: tipo,
          latitud: latitudActual,
          longitud: longitudActual,
          urlFoto: urlSelfie,
          deviceId: obtenerDeviceId()
        };

        if (esExcepcionVisible) {
          payload.datosExcepcion = {
            esExcepcion: true,
            motivo: motivoTexto,
            detalle: detalleTexto,
            evidenciaUrl: urlEvidencia
          };
        }

        const res = await llamarAPI(payload);

        // Si el servidor indica que está fuera de geocerca por primera vez
        if (!res.ok && res.fueraGeocerca) {
          requiereExcepcion = true;
          panelEx.style.display = "block";
          boton.disabled = false;
          boton.innerHTML = `Registrar ${tipo} con Justificación`;
          mostrarMensaje(res.mensaje, "error");
          panelEx.scrollIntoView({ behavior: 'smooth' });
          return;
        }

        mostrarMensaje(res.mensaje, res.ok ? "ok" : "error");

        if (res.ok) {
          boton.innerHTML = `✅ ${tipo} Registrado`;
          boton.style.background = "#16a34a";
          setTimeout(() => {
            if (tipo === "INGRESO") {
              document.getElementById("btnIngreso").style.display = "none";
              document.getElementById("btnSalida").style.display = "block";
              panelEx.style.display = "none";
              evidenciaActual = null;
              requiereExcepcion = false;
            } else {
              document.getElementById("marcajePanel").innerHTML = "<h2 style='color:#16a34a; text-align:center;'>✅ Jornada completada</h2>";
            }
          }, 1500);
        } else {
          boton.disabled = false;
          boton.innerHTML = `Registrar ${tipo}`;
        }
      } catch (err) {
        boton.disabled = false;
        mostrarMensaje("Error al conectar: " + err.message, "error");
      }
    }

    async function registrarNuevoTrabajador() {
      const dni = document.getElementById("regDni").value.trim();
      const correo = document.getElementById("regCorreo").value.trim();
      const nombres = document.getElementById("regNombres").value.trim();
      const apellidos = document.getElementById("regApellidos").value.trim();

      if (!dni || !correo || !nombres || !apellidos) return mostrarMensaje("Completa los campos obligatorios", "error");

      mostrarMensaje("Enviando solicitud a RRHH...", "ok");
      const datos = {
        dni: dni,
        correo: correo,
        nombres: nombres,
        apellidos: apellidos,
        celular: document.getElementById("regCelular").value.trim(),
        sede: document.getElementById("regSede").value
      };

      try {
        const res = await llamarAPI({ accion: "registrarSolicitudTrabajador", datos: datos });
        mostrarMensaje(res.mensaje, res.ok ? "ok" : "error");
        if (res.ok) setTimeout(alternarRegistro, 2000);
      } catch (err) {
        mostrarMensaje("Error: " + err.message, "error");
      }
    }

    function configurarBotonesPlanilla(estado) {
      const btnIngreso = document.getElementById("btnIngreso");
      const btnSalida = document.getElementById("btnSalida");
      if (estado === "INGRESO") {
        btnIngreso.style.display = "block";
        btnSalida.style.display = "none";
      } else if (estado === "SALIDA") {
        btnIngreso.style.display = "none";
        btnSalida.style.display = "block";
      } else {
        document.getElementById("marcajePanel").innerHTML = "<h2 style='color:#16a34a;'>✅ Jornada completada</h2>";
      }
    }
  </script>
</body>
